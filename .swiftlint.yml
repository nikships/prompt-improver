excluded:
  - .agents
  - .build
  - .swiftpm
  - dist
  - Sources/PromptImprover/LogoView.swift

disabled_rules:
  - optional_data_string_conversion

line_length:
  warning: 150
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 80
  error: 80

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

trailing_comma:
  mandatory_comma: false
