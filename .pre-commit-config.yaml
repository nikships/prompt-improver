repos:
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
      - id: lint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: test
        name: Vitest
        entry: npm test
        language: system
        pass_filenames: false
